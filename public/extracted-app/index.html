      (function(){
        try{
          var K='ai_insurance_members_v2',raw=localStorage.getItem(K);
          if(raw){
            var a;
            try{a=JSON.parse(raw)}catch(e){a=null}
            if(Array.isArray(a) && a.length>0){
              var block=['AG000001','AG000002','AG000005','AG000012'];
              var hasBlock=a.some(function(m){
                var c=(m.memberCode||m.code||m.member_code||'').toUpperCase();
                var n=(m.name||'');
                return block.indexOf(c)!==-1 || n.indexOf('สมชาย')!==-1 || n.indexOf('กานดา')!==-1 || n.indexOf('วิชัย')!==-1 || n.indexOf('อานนท์')!==-1;
              });
              var hasFake=a.some(function(m){
                var e=(m.email||'').toLowerCase(),c=m.memberCode||m.code||'',n=(m.name||'').toLowerCase();
                return e.indexOf('insurance.co.th')!==-1 || e.indexOf('demo@example')!==-1 || e.indexOf('mock')!==-1
                  || c.indexOf('MEM-00')!==-1 || n.indexOf('ทดสอบ')!==-1;
              });
              if(hasBlock || hasFake){
                localStorage.setItem(K,'[]');
                localStorage.removeItem('ai_insurance_audit_logs_v2');
                localStorage.removeItem('ai_insurance_rules_v2');
                localStorage.removeItem('ai_insurance_placement_settings_v2');
                localStorage.removeItem('ai_insurance_plan_version_v2');
                localStorage.setItem('_preboot_v5','1');
                console.log('[PRE-BOOT V5] cleared blocked 4 codes', a.length);
              }
            }
          }

          try{localStorage.removeItem('_cleanup_v3');localStorage.removeItem('_cleanup_v4');}catch(e){}
        }catch(e){}
      })();
    </script>

    <script>
      // Deep-link support: /extracted-app/#<tab> -> click the matching sidebar item
      // (tab ids mirror the extracted app's internal nav: nav-item-<id>)
      (function () {
        var TAB_IDS = ['dashboard','network_tree','members','registration','auto_builder','auto_sponsor','calculator','promotion','simulator','rules_editor','audit_logs'];
        function applyHash() {
          var h = (location.hash || '').replace(/^#\/?/, '');
          if (!h || TAB_IDS.indexOf(h) === -1) return;
          var el = document.getElementById('nav-item-' + h);
          if (el) el.click();
        }
        var tries = 0;
        var timer = setInterval(function () {
          applyHash();
          if (++tries > 50) clearInterval(timer); // ~15s max wait for React mount
        }, 300);
        window.addEventListener('hashchange', applyHash);
      })();
    </script>
    <script>
      // Status badge: read "โหมดจัดสายงาน" + "เลขผู้แนะนำรันปัจจุบัน" from the (hidden) sidebar DOM
      // and show them as a floating badge so the info stays visible without the duplicated sidebar.
      (function () {
        function createBadge() {
          var badge = document.createElement('div');
          badge.id = 'ext-status-badge';
          badge.innerHTML =
            '<div class="row"><span class="k">โหมดจัดสายงาน:</span><span class="mode" id="ext-badge-mode">–</span></div>' +
            '<div class="row"><span class="k">เลขผู้แนะนำรันปัจจุบัน:</span><span class="sponsor" id="ext-badge-sponsor">–</span></div>';
          document.body.appendChild(badge);
          return badge;
        }
        function readStatus() {
          try {
            var sidebar = document.getElementById('app-sidebar-desktop');
            if (!sidebar) return;
            var spans = sidebar.querySelectorAll('span');
            for (var i = 0; i < spans.length; i++) {
              var c = spans[i].className || '';
              if (typeof c === 'string' && c.indexOf('bg-emerald-500/20') !== -1) {
                document.getElementById('ext-badge-mode').textContent = spans[i].textContent;
              }
              if (typeof c === 'string' && c.indexOf('font-mono') !== -1 && c.indexOf('font-bold') !== -1) {
                document.getElementById('ext-badge-sponsor').textContent = spans[i].textContent;
              }
            }
          } catch (e) { /* ignore */ }
        }
        createBadge();
        readStatus();
        setInterval(readStatus, 800); // keep in sync if user changes mode / runs auto-sponsor
      })();
    </script>
    <script>
      // Member sync: when a new agent registers inside this app, capture the data and
      // POST it to /api/members (same-origin) so it lands in Firestore (Vercel),
      // Google Sheets and owner notifications — and the main OS picks it up via its
      // Firestore realtime listener (เชื่อมข้อมูลในระบบเดียวกัน).
      (function () {
        var SEEN_KEY = 'extracted_synced_members_v1';
        var seen = {};
        try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); } catch (e) {}
        function seenSave() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} }

        function $(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

        function findSuccessBanner() {
          var divs = document.querySelectorAll('div');
          for (var i = 0; i < divs.length; i++) {
            var el = divs[i];
            var cn = el.className;
            if (typeof cn === 'string' && cn.indexOf('from-emerald-900') !== -1 && el.textContent.indexOf('สมัครสมาชิกสำเร็จ') !== -1) {
              return el;
            }
          }
          return null;
        }

        function capture() {
          var banner = findSuccessBanner();
          if (!banner) return;

          var code = null;
          var sponsor = '';
          var placement = '';
          var spans = banner.querySelectorAll('span');
          for (var j = 0; j < spans.length; j++) {
            var sc = spans[j].className || '';
            var tx = spans[j].textContent.trim();
            if (typeof sc === 'string' && sc.indexOf('font-mono') !== -1 && sc.indexOf('text-amber-300') !== -1 && /^AG\d+$/.test(tx)) {
              code = tx;
            }
          }
          var strongs = banner.querySelectorAll('strong');
          for (var k = 0; k < strongs.length; k++) {
            var kc = strongs[k].className || '';
            var kt = strongs[k].textContent.trim();
            if (typeof kc === 'string' && kc.indexOf('text-sky-300') !== -1) placement = kt;
            else if (typeof kc === 'string' && kc.indexOf('font-mono') !== -1 && /^AG\d+$/.test(kt)) sponsor = kt;
          }
          if (!code || seen[code]) return;

          var fyc = parseFloat($('input-member-fyc')) || 0;
          var renewal = parseFloat($('input-member-renewal')) || 0;
          var today = new Date().toISOString().slice(0, 10);
          var row = {
            id: 'ext_' + code,
            memberId: 'ext_' + code,
            memberCode: code,
            name: ($('input-member-name') + ' ' + $('input-member-surname')).trim(),
            nickname: $('input-member-nickname'),
            avatarUrl: '',
            positionId: 'agent',
            role: 'agent',
            sponsorId: sponsor || 'SYSTEM',
            parentMemberId: placement && /^AG\d+$/.test(placement) ? placement : null,
            unitId: null,
            centerId: null,
            regionId: null,
            joinDate: today,
            status: 'active',
            phone: $('input-member-phone'),
            email: $('input-member-email'),
            location: { province: '', region: 'Bangkok & Metro', lat: 0, lng: 0 },
            personalFYC: fyc,
            personalCOM: 0,
            firstYearPremium: 0,
            renewalPremium: renewal,
            registeredAt: new Date().toISOString(),
            source: 'team-builder',
            placementParent: placement,
          };

          fetch('/api/members', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(row),
          })
            .then(function (r) { return r.json(); })
            .then(function (j) { seen[code] = 1; seenSave(); })
            .catch(function () { /* network error -> retry on next tick */ });
        }

        setInterval(capture, 1200);
        try {
          new MutationObserver(capture).observe(document.body, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>
  
    <script>
      // Force cleanup - ลบสมาชิกปลอมทั้งหมดที่ค้างในระบบ (v2)
      (function () {
        try {
          var today = new Date().toISOString().slice(0,10);
          var now = new Date().toISOString();
          // Clear localStorage fake demo data
          var keys = Object.keys(localStorage);
          keys.forEach(function(k){
            try {
              var v = localStorage.getItem(k);
              if (v && (v.indexOf("demo@example.com") !== -1 || v.indexOf("MEM-00") !== -1 || v.indexOf("AG-101") !== -1)) {
                var parsed = JSON.parse(v);
                if (Array.isArray(parsed)) {
                  var filtered = parsed.filter(function(m){ 
                    var email = (m.email||"").toLowerCase();
                    var code = m.memberCode||m.code||"";
                    return email.indexOf("demo@example.com")===-1 && email.indexOf("mock")===-1 && code.indexOf("MEM-00")===-1;
                  });
                  if (filtered.length !== parsed.length) {
                    localStorage.setItem(k, JSON.stringify(filtered));
                  }
                }
              }
              // Update any stored dates that are old (2024/2025)
              if (v && v.indexOf("2024-")===-1 && v.indexOf("2025-")===-1) {}
            } catch(e){}
          });
          // Ensure current date is used for new registrations
          var dateInputs = document.querySelectorAll("input[type=date]");
          dateInputs.forEach(function(inp){ if(!inp.value) inp.value = today; });
          console.log("[extracted-app] Auto-cleanup done, date:", today);
        } catch(e){ console.log("cleanup error", e); }
      })();
    </script>
